<!DOCTYPE html>
<html>
<head>
<title>Golf Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    font-family: Arial, sans-serif;
    background: #0a1f0a;
    color: #e0f0e0;
    margin: 0;
    padding: 15px;
}
h1 {
    text-align: center;
    color: #4ade80;
    margin: 10px 0 20px;
}
.card {
    background: rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    border: 1px solid rgba(74, 222, 128, 0.1);
}
input, select, button {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    font-size: 17px;
    border-radius: 12px;
    border: none;
    background: rgba(255,255,255,0.1);
    color: white;
}
button {
    background: #22c55e;
    color: #0a1f0a;
    font-weight: bold;
    cursor: pointer;
}
button:active {
    background: #16a34a;
}
.red-btn {
    background: #ef4444;
}
input[type="number"] {
    width: 100%;
}
table {
    width: 100%;
    border-collapse: collapse;
    margin: 15px 0;
    background: rgba(255,255,255,0.05);
    overflow-x: auto;
    display: block;
}
th, td {
    padding: 10px;
    text-align: center;
    border: 1px solid #334433;
    white-space: nowrap;
}
th { background: rgba(74, 222, 128, 0.1); }
.winner {
    background: linear-gradient(90deg, #166534, #4ade80);
    color: white;
    padding: 20px;
    border-radius: 16px;
    text-align: center;
    margin: 15px 0;
}
.highlight { background: #4ade80 !important; color: #0a1f0a; font-weight: bold; }

/* Page Management */
.page {
    display: none;
}
.page.active {
    display: block;
}
</style>
</head>
<body>

<!-- Page 1: Setup -->
<div id="page1" class="page active">
    <h1>🏌️ Golf Tracker</h1>
    <div class="card">
        <select id="course" onchange="loadCourse()"></select>
        <select id="mode" onchange="showModeDesc()">
            <option value="Stroke">Stroke Play</option>
            <option value="Scramble">Scramble</option>
            <option value="Nassau">Nassau</option>
            <option value="Skins">Skins</option>
        </select>
        <div id="modeDesc" style="font-size:15px;margin:12px 0"></div>
    </div>

    <div class="card">
        <input id="player" placeholder="Player name">
        <button onclick="addPlayer()">Add Player</button>
        <div id="players"></div>
    </div>

    <button onclick="startGame()" style="width:100%;padding:18px;font-size:18px">Start Game →</button>
</div>

<!-- Page 2: Main Scoring -->
<div id="page2" class="page">
    <h1>🏌️ Golf Tracker</h1>
    <div style="text-align:center;margin-bottom:15px">
        <span id="currentCourse" style="color:#4ade80"></span> • 
        <span id="currentMode"></span>
    </div>

    <div class="card">
        <h2>Enter / Edit Score</h2>
        <select id="hole"></select>
        <select id="playerSelect"></select>
        <input id="strokes" type="number" placeholder="Strokes">
        <button onclick="addScore()">Add / Update Score</button>
    </div>

    <div class="card">
        <h2>🍫 Give Handicap Stroke (Chocolate)</h2>
        <select id="chocoPlayer"></select>
        <select id="chocoHole"></select>
        <input id="chocoStrokes" type="number" value="1" style="width:80px">
        <button onclick="giveChocolate()">Give / Update Chocolate</button>
    </div>

    <div id="leaderboard" class="card"></div>

    <button onclick="showLeaderboard()" style="width:100%;margin:8px 0">Show Leaderboard</button>
    <button onclick="showWinner()" style="width:100%;margin:8px 0">Show Winner</button>
    <button onclick="resetGame()" class="red-btn" style="width:100%">Reset Game</button>
</div>

<script>
// (Full JavaScript logic - same as before with page navigation)
let players = [];
let scores = {};
let chocolates = {};
let pars = [4,4,5,4,3,4,5,3,4,4,4,5,3,4,3,5,4,4];
let currentPage = 1;

const courses = { /* all courses same as before */ 
  "Forest City Classic": [4,4,5,4,3,4,5,3,4,4,4,5,3,4,3,5,4,4],
  "Forest City Legacy": [4,4,5,4,3,4,5,3,4,4,4,5,3,4,3,5,4,4],
  "Els Golf Lakes": [4,3,4,5,4,4,3,5,4,4,4,5,3,4,5,4,3,4],
  "Sentosa Serapong": [4,4,5,4,3,4,5,3,4,4,4,5,3,4,3,5,4,4],
  "Tanjong Puteri Plantation": [5,4,4,3,4,4,5,3,4,4,3,4,4,5,3,4,5,4],
  "Permaipura Golf": [4,4,3,4,5,3,5,4,4,4,4,4,3,4,3,5,5,5],
  "Senibong Golf": [4,3,4,4,3,4,5,3,5,4,4,4,4,5,5,4,4,3],
  "Johor Bahru Golf": [4,4,4,3,5,5,4,3,3,5,4,3,4,5,4,4,4,3],
  "Permas Jaya 9H": [4,3,5,4,3,4,5,4,4],
  "Horizon Hill Golf": [4,5,3,4,4,5,4,3,4,4,4,3,5,4,4,4,3,5]
};

function showPage(page) {
  document.getElementById('page1').classList.remove('active');
  document.getElementById('page2').classList.remove('active');
  document.getElementById('page' + page).classList.add('active');
  currentPage = page;
}

function startGame() {
  if (players.length === 0) {
    alert("Please add at least one player");
    return;
  }
  document.getElementById('currentCourse').textContent = document.getElementById('course').value;
  document.getElementById('currentMode').textContent = document.getElementById('mode').value;
  showPage(2);
  showLeaderboard();
}

function loadCourse() {
  let course = document.getElementById('course').value;
  if (course && courses[course]) pars = courses[course];
  updateHoles();
}

// ... (rest of functions same as before - addPlayer, updatePlayerSelect, addScore, giveChocolate, etc.)

// Initialize
function init() {
  const courseSelect = document.getElementById('course');
  Object.keys(courses).forEach(course => {
    let opt = document.createElement('option');
    opt.value = course;
    opt.textContent = course;
    courseSelect.appendChild(opt);
  });
  updateHoles();
  updatePlayerSelect();
}

init();
</script>
</body>
</html>
