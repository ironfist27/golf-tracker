<!DOCTYPE html>
<html>
<head>
<title>Golf Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {font-family:Arial;background:#0a1f0a;color:#e0f0e0;padding:15px;margin:0}
h1 {text-align:center;color:#4ade80}
.card {background:rgba(255,255,255,0.08);border-radius:18px;padding:18px;margin-bottom:18px}
select, input, button {padding:15px;margin:8px 0;width:100%;font-size:17px;border-radius:12px;border:none;background:rgba(255,255,255,0.12);color:white; box-sizing:border-box}
button {background:#22c55e;color:#0a1f0a;font-weight:bold}
button:active {background:#16a34a}
.red-btn {background:#ef4444}
.download-btn {background:#3b82f6 !important}
table {width:100%;border-collapse:collapse;margin:15px 0;background:#1a1a1a;overflow-x:auto;display:block}
th, td {border:1px solid #334433;padding:10px;text-align:center;white-space:nowrap}
th {background:#1f3a1f}
.winner {background:#166534;color:white;padding:20px;text-align:center;font-size:20px;margin:15px 0;border-radius:14px}
.highlight {background:#4ade80 !important;color:#0a1f0a;font-weight:bold}
.page {display:none}
.page.active {display:block}
.log {margin-top:8px;color:#4ade80;font-size:14px}
</style>
</head>
<body>

<!-- Page 1: Setup -->
<div id="page1" class="page active">
    <h1>🏌️ Golf Tracker</h1>
    
    <div class="card">
        <select id="course" onchange="loadCourse()">
            <optgroup label="🇸🇬 Singapore">
                <option value="Sentosa Serapong">Sentosa Serapong</option>
                <option value="Sentosa Tanjong">Sentosa Tanjong</option>
                <option value="Orchid Country Club Aranda Dendro">Orchid CC - Aranda Dendro</option>
                <option value="Orchid Country Club Aranda Vanda">Orchid CC - Aranda Vanda</option>
                <option value="Orchid Country Club Dendra Aranda">Orchid CC - Dendra Aranda</option>
                <option value="Orchid Country Club Dendro Vanda">Orchid CC - Dendro Vanda</option>
                <option value="Tanah Merah Tampines">Tanah Merah Tampines</option>
                <option value="Tanah Merah Garden">Tanah Merah Garden</option>
                <option value="Laguna National Masters">Laguna National Masters</option>
                <option value="Singapore Island Country Club">Singapore Island CC</option>
                <option value="Seletar Country Club">Seletar Country Club</option>
            </optgroup>
            
            <optgroup label="🇲🇾 Malaysia">
                <option value="Forest City Classic">Forest City Classic</option>
                <option value="Forest City Legacy">Forest City Legacy</option>
                <option value="Els Golf Lakes">Els Golf Lakes</option>
                <option value="Tanjong Puteri Plantation">Tanjong Puteri Plantation</option>
                <option value="Permaipura Golf">Permaipura Golf</option>
                <option value="Senibong Golf">Senibong Golf</option>
                <option value="Johor Bahru Golf">Johor Bahru Golf</option>
                <option value="Permas Jaya 9H">Permas Jaya 9H</option>
                <option value="Horizon Hill Golf">Horizon Hill Golf</option>
                <option value="Mountain View Golf">Mountain View Golf</option>
                <option value="Bukit Jawi Golf Hill Course">Bukit Jawi Hill</option>
                <option value="Bukit Jawi Golf Lake Course">Bukit Jawi Lake</option>
                <option value="Royal Kedah Club">Royal Kedah Club</option>
                <option value="Darulaman Golf Country Club">Darulaman Golf CC</option>
                <option value="Kulim Golf Country Club">Kulim Golf CC</option>
            </optgroup>
            
            <optgroup label="🇮🇩 Indonesia">
                <option value="Batam Island Country Club Nongsa">Batam Island CC Nongsa</option>
                <option value="Batam Hill Golf">Batam Hill Golf</option>
                <option value="South Links Country Club">South Links Country Club</option>
            </optgroup>
        </select>
        
        <select id="mode" onchange="showModeDesc()">
            <option value="Stroke">Stroke Play</option>
            <option value="Scramble">Scramble</option>
            <option value="Nassau">Nassau</option>
            <option value="Skins">Skins</option>
        </select>
        <div id="modeDesc" style="font-size:15px;margin:12px 0"></div>
    </div>

    <div class="card">
        <input id="player" placeholder="Player name">
        <button onclick="addPlayer()">Add Player</button>
        <div id="players" style="margin-top:10px"></div>
    </div>

    <button onclick="startGame()" style="width:100%;padding:18px;font-size:18px;background:#22c55e">Start Game →</button>
</div>

<!-- Page 2: Scoring -->
<div id="page2" class="page">
    <h1>🏌️ Golf Tracker</h1>
    <div style="text-align:center;margin-bottom:15px;color:#4ade80">
        <span id="currentCourse"></span> • <span id="currentMode"></span>
    </div>

    <div class="card">
        <h2>Enter / Edit Score</h2>
        <select id="hole"></select>
        <select id="playerSelect"></select>
        <input id="strokes" type="number" placeholder="Strokes">
        <button onclick="addScore()">Add / Update Score</button>
        <div id="scoreLog" class="log"></div>
    </div>

    <div class="card">
        <h2>🍫 Give Handicap Stroke (Chocolate)</h2>
        <select id="chocoPlayer"></select>
        <select id="chocoHole"></select>
        <input id="chocoStrokes" type="number" placeholder="Strokes" value="1">
        <button onclick="giveChocolate()">Give / Update Chocolate</button>
        <div id="chocoLog" class="log"></div>
    </div>

    <div id="leaderboard" class="card"></div>

    <button onclick="showLeaderboard()" style="width:100%;margin:8px 0">Show Leaderboard</button>
    <button onclick="showWinner()" style="width:100%;margin:8px 0">Show Winner</button>
    <button onclick="downloadScorecard()" class="download-btn" style="width:100%;margin:8px 0">📸 Download Scorecard as PNG</button>
    <button onclick="resetGame()" class="red-btn" style="width:100%">Reset Game</button>
</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>
let players = [];
let scores = {};
let chocolates = {};
let pars = [4,4,5,4,3,4,5,3,4,4,4,5,3,4,3,5,4,4];
let currentCourseName = "";

const courses = {
  // Singapore
  "Sentosa Serapong": [4,4,5,4,3,4,5,3,4,4,4,5,3,4,3,5,4,4],
  "Sentosa Tanjong": [4,3,4,4,5,4,4,3,5,4,4,5,3,4,4,3,5,4],
  "Orchid Country Club Aranda Dendro": [4,3,4,5,4,3,5,4,4,5,4,5,3,4,5,4,3,4],
  "Orchid Country Club Aranda Vanda": [4,3,4,5,4,3,5,4,4,4,3,3,4,4,5,4,4,5],
  "Orchid Country Club Dendra Aranda": [5,4,5,3,4,5,4,3,4,4,3,4,5,4,3,5,4,4],
  "Orchid Country Club Dendro Vanda": [5,4,5,3,4,3,4,4,4,4,3,3,4,4,5,4,4,5],
  "Tanah Merah Tampines": [4,4,5,4,3,4,5,3,4,4,4,5,3,4,3,5,4,4],
  "Tanah Merah Garden": [4,4,3,4,5,4,4,3,5,4,4,5,3,4,4,3,5,4],
  "Laguna National Masters": [4,5,3,4,4,5,4,3,5,4,4,5,3,4,4,3,5,4],
  "Singapore Island Country Club": [4,4,5,4,3,4,5,3,4,4,4,5,3,4,3,5,4,4],
  "Seletar Country Club": [4,4,5,4,3,4,5,3,4,4,4,5,3,4,3,5,4,4],

  // Indonesia
  "Batam Island Country Club Nongsa": [4,5,4,3,4,4,3,5,4,4,5,4,3,4,3,4,5,4],
  "Batam Hill Golf": [4,5,4,3,5,4,3,4,4,4,4,3,4,4,5,3,4,4],
  "South Links Country Club": [4,4,4,3,4,5,3,4,5,4,5,4,3,4,4,4,3,5],

  // Malaysia
  "Forest City Classic": [4,4,5,4,3,4,5,3,4,4,4,5,3,4,3,5,4,4],
  "Forest City Legacy": [4,4,5,4,3,4,5,3,4,4,4,5,3,4,3,5,4,4],
  "Els Golf Lakes": [4,3,4,5,4,4,3,5,4,4,4,5,3,4,5,4,3,4],
  "Tanjong Puteri Plantation": [5,4,4,3,4,4,5,3,4,4,3,4,4,5,3,4,5,4],
  "Permaipura Golf": [4,4,3,4,5,3,5,4,4,4,4,4,3,4,3,5,5,5],
  "Senibong Golf": [4,3,4,4,3,4,5,3,5,4,4,4,4,5,5,4,4,3],
  "Johor Bahru Golf": [4,4,4,3,5,5,4,3,3,5,4,3,4,5,4,4,4,3],
  "Permas Jaya 9H": [4,3,5,4,3,4,5,4,4],
  "Horizon Hill Golf": [4,5,3,4,4,5,4,3,4,4,4,3,5,4,4,4,3,5],
  "Mountain View Golf": [4,3,5,4,4,4,3,4,5,4,5,4,3,4,4,3,4,5],
  "Bukit Jawi Golf Hill Course": [4,3,4,4,4,5,4,3,5,5,4,3,4,3,5,3,4,5],
  "Bukit Jawi Golf Lake Course": [5,3,4,3,4,4,4,4,5,4,5,3,5,4,3,4,4,4],
  "Royal Kedah Club": [4,5,4,3,4,5,3,4,4,4,5,4,3,4,5,3,4,4],
  "Darulaman Golf Country Club": [5,4,3,3,5,3,4,4,4,5,3,4,4,3,4,5,4,4],
  "Kulim Golf Country Club": [4,4,3,5,4,4,3,5,4,4,4,3,5,3,4,5,4,4]
};

function showPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page' + page).classList.add('active');
}

function startGame() {
  if (players.length === 0) return alert("Please add at least one player");
  
  currentCourseName = document.getElementById('course').value || "No Course";
  document.getElementById('currentCourse').textContent = currentCourseName;
  document.getElementById('currentMode').textContent = document.getElementById('mode').value;
  
  showPage(2);
  updatePlayerSelect();
  showLeaderboard();
}

function loadCourse() {
  let course = document.getElementById('course').value;
  if (course && courses[course]) pars = courses[course];
  updateHoles();
}

function showModeDesc() {
  let mode = document.getElementById('mode').value;
  let desc = document.getElementById('modeDesc');
  const texts = {
    "Stroke": "Lowest total strokes wins.",
    "Scramble": "Best shot every hole. Lowest total wins.",
    "Nassau": "Bet on Front 9, Back 9, and Full 18.",
    "Skins": "Lowest score on each hole wins the skin."
  };
  desc.innerHTML = texts[mode] || "";
}

function updateHoles() {
  let select = document.getElementById('hole');
  let chocoSelect = document.getElementById('chocoHole');
  select.innerHTML = chocoSelect.innerHTML = '';
  for (let i = 1; i <= pars.length; i++) {
    let opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `Hole ${i} (Par ${pars[i-1]})`;
    select.appendChild(opt);
    chocoSelect.appendChild(opt.cloneNode(true));
  }
}

function addPlayer() {
  let name = document.getElementById('player').value.trim();
  if (!name) return alert("Please enter a player name");
  if (players.includes(name)) return alert("Player already exists!");
  
  players.push(name);
  scores[name] = Array(pars.length).fill(0);
  chocolates[name] = Array(pars.length).fill(0);
  document.getElementById('player').value = '';
  updatePlayerList();
  updatePlayerSelect();
}

function updatePlayerList() {
  document.getElementById('players').innerHTML = "<b>Players:</b><br>" + players.join("<br>");
}

function updatePlayerSelect() {
  let pSelect = document.getElementById('playerSelect');
  let cSelect = document.getElementById('chocoPlayer');
  pSelect.innerHTML = cSelect.innerHTML = '';
  players.forEach(p => {
    let opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p;
    pSelect.appendChild(opt);
    cSelect.appendChild(opt.cloneNode(true));
  });
}

function addScore() {
  let hole = parseInt(document.getElementById('hole').value) - 1;
  let player = document.getElementById('playerSelect').value;
  let strokes = parseInt(document.getElementById('strokes').value);
  if (player && strokes > 0) {
    scores[player][hole] = strokes;
    document.getElementById('scoreLog').innerHTML = `✅ ${player} - Hole ${hole+1}: ${strokes}`;
    showLeaderboard();
  }
}

function giveChocolate() {
  let player = document.getElementById('chocoPlayer').value;
  let hole = parseInt(document.getElementById('chocoHole').value) - 1;
  let strokes = parseInt(document.getElementById('chocoStrokes').value) || 1;
  if (player) {
    chocolates[player][hole] += strokes;
    document.getElementById('chocoLog').innerHTML = `🍫 ${player} - Hole ${hole+1}: +${strokes}`;
    showLeaderboard();
  }
}

function showLeaderboard() {
  let numHoles = pars.length;
  let html = `<h2>${currentCourseName} - ${numHoles} Holes</h2><table>`;
  html += "<tr><th>Player</th>";
  for (let i = 1; i <= numHoles; i++) html += `<th>H${i}</th>`;
  html += "<th>Gross</th><th>Chocolate</th><th>Net</th></tr>";

  players.forEach(p => {
    let gross = scores[p].reduce((a,b) => a + b, 0);
    let chocoTotal = chocolates[p].reduce((a,b) => a + b, 0);
    let net = gross - chocoTotal;
    html += `<tr><td>${p}</td>`;
    for (let i = 0; i < numHoles; i++) {
      let s = scores[p][i] || "-";
      let c = chocolates[p][i] > 0 ? `(+${chocolates[p][i]})` : "";
      html += `<td>${s} ${c}</td>`;
    }
    html += `<td><b>${gross}</b></td><td>${chocoTotal}</td><td><b>${net}</b></td></tr>`;
  });
  html += "</table>";
  document.getElementById('leaderboard').innerHTML = html;
}

function showWinner() {
  let mode = document.getElementById('mode').value;
  let html = '<div class="winner"><h2>🏆 Winner Result (' + mode + ')</h2>';

  if (mode === "Stroke" || mode === "Scramble") {
    let results = players.map(p => {
      let gross = scores[p].reduce((a,b) => a + b, 0);
      let choco = chocolates[p].reduce((a,b) => a + b, 0);
      return {name: p, net: gross - choco};
    }).sort((a,b) => a.net - b.net);

    html += `<h3>Overall Winner: <b>${results[0].name}</b> (Net ${results[0].net})</h3>`;
    html += '<table><tr><th>Rank</th><th>Player</th><th>Net Score</th></tr>';
    results.forEach((r, i) => {
      let cls = (i === 0) ? ' class="highlight"' : '';
      html += `<tr${cls}><td>${i+1}</td><td>${r.name}</td><td>${r.net}</td></tr>`;
    });
    html += '</table>';
  } else if (mode === "Skins") {
    html += '<h3>Skins Winners (Lowest per hole)</h3>';
    html += '<table><tr><th>Hole</th><th>Winner</th><th>Score</th></tr>';
    for (let h = 0; h < pars.length; h++) {
      let minScore = Infinity, winner = '';
      players.forEach(p => {
        let s = scores[p][h];
        if (s > 0 && s < minScore) {
          minScore = s;
          winner = p;
        }
      });
      if (winner) html += `<tr><td>H${h+1}</td><td>${winner}</td><td>${minScore}</td></tr>`;
    }
    html += '</table>';
  }
  html += '</div>';
  document.getElementById('leaderboard').innerHTML += html;
}

function downloadScorecard() {
  const lb = document.getElementById('leaderboard');
  if (!lb.innerHTML.trim()) return alert("Please show leaderboard first");
  
  html2canvas(lb, {backgroundColor: "#0a1f0a", scale: 2}).then(canvas => {
    const link = document.createElement('a');
    link.download = currentCourseName.replace(/ /g, '_') + '_Scorecard.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    alert("✅ Scorecard downloaded successfully!");
  });
}

function resetGame() {
  scores = {}; chocolates = {}; players = [];
  document.getElementById('leaderboard').innerHTML = '';
  document.getElementById('scoreLog').innerHTML = '';
  document.getElementById('chocoLog').innerHTML = '';
  updatePlayerList();
  updatePlayerSelect();
  showPage(1);
}

function init() {
  updateHoles();
  updatePlayerSelect();
}

init();
</script>
</body>
</html>
